name: tern_updater
description: Tern update status, a ready-to-restart banner, and an Android cold restart for Flutter apps.
version: 0.3.2
publish_to: none
repository: https://github.com/hatchmoon/tern_updater
environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.44.8'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: cv.hatchmoon.tern.updater
        pluginClass: TernUpdaterPlugin
